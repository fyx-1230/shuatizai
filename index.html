}

/* ---------- 模拟考试（EX / EXSET / LOG 由 boot 载入） ---------- */
let EX=null;
let EXSET=EMPTY_EXSET();
let LOG=[];

function shuffleArr(a){
  for(let i=a.length-1;i>0;i--){ const k=Math.floor(Math.random()*(i+1)); [a[i],a[k]]=[a[k],a[i]]; }
  return a;
}

function examSetup(){
  if(!hasLib()){ return home(); }
  clearAuto();
  titleEl.innerHTML='模拟考试<span class="sub">设置题量</span>';
  backEl.style.display=''; backEl.onclick=home; ft.style.display='';
  // 题量上限随题库变化，进来先夹一次
  EXSET.s=Math.min(EXSET.s, POOL[1]); EXSET.m=Math.min(EXSET.m, POOL[2]); EXSET.j=Math.min(EXSET.j, POOL[3]);
  saveSet();
  const rows=[['s',1,'单选题'],['m',2,'多选题'],['j',3,'判断题']].map(function(r){
    const k=r[0], t=r[1], label=r[2];
    return '<div class="setrow"><div><div class="sl">'+label+'</div><div class="sc">题库 '+POOL[t]+' 题</div></div>'
      + '<div class="stepper">'
      + '<button onclick="adj(\''+k+'\',-5)" '+(EXSET[k]<=0?'disabled':'')+'>−</button>'
      + '<input type="text" inputmode="numeric" value="'+EXSET[k]+'" oninput="setNum(\''+k+'\',this)" onblur="normNum(\''+k+'\',this)">'
      + '<button onclick="adj(\''+k+'\',5)" '+(EXSET[k]>=POOL[t]?'disabled':'')+'>+</button>'
      + '</div></div>';
  }).join('');
  body.innerHTML='<div class="card">'+rows
    + '<div class="setrow"><div><div class="sl">选项乱序</div><div class="sc">打乱单选/多选的 A/B/C/D 位置，判断题不变</div></div>'
    + '<div class="switch'+(EXSET.shuffle?' on':'')+'" onclick="toggleShuffle()"><i></i></div></div>'
    + '<div class="setrow"><div><div class="sl">答错即时看答案</div><div class="sc">选错后立刻显示正确答案和解析</div></div>'
    + '<div class="switch'+(EXSET.showAns?' on':'')+'" onclick="toggleShowAns()"><i></i></div></div>'
    + '<div class="setrow"><div><div class="sl">限时交卷</div><div class="sc">到点自动交卷，模拟真实考场</div></div>'
    + '<div class="switch'+(EXSET.timed?' on':'')+'" onclick="toggleTimed()"><i></i></div></div>'
    + (EXSET.timed
        ? '<div class="setrow"><div><div class="sl">考试时长</div><div class="sc">分钟</div></div>'
          + '<div class="stepper">'
          + '<button onclick="adjMin(-10)" '+(EXSET.mins<=10?'disabled':'')+'>−</button>'
          + '<input type="text" inputmode="numeric" value="'+EXSET.mins+'" oninput="setMin(this)" onblur="normMin(this)">'
          + '<button onclick="adjMin(10)" '+(EXSET.mins>=300?'disabled':'')+'>+</button>'
          + '</div></div>'
        : '')
    + '</div><div class="sumline" id="sumline"></div>';
  updateSum();
  ftin.innerHTML='<button class="fbtn p" onclick="startExam()">开始考试</button>';
}
function lim(k){ return {s:POOL[1],m:POOL[2],j:POOL[3]}[k]; }
function adj(k,d){
  EXSET[k]=Math.max(0,Math.min(lim(k), EXSET[k]+d));
  saveSet(); refreshStep(k,true); updateSum();
}
function setNum(k,el){
  const raw=el.value.replace(/\D/g,'');
  if(el.value!==raw) el.value=raw;
  let n=parseInt(raw,10); if(isNaN(n)) n=0;
  EXSET[k]=Math.max(0,Math.min(lim(k),n));
  saveSet(); refreshStep(k,false); updateSum();
}
function normNum(k,el){
  let n=parseInt(el.value,10); if(isNaN(n)) n=0;
  EXSET[k]=Math.max(0,Math.min(lim(k),n));
  saveSet(); el.value=EXSET[k]; refreshStep(k,true); updateSum();
}
function refreshStep(k,syncInput){
  const inputs=document.querySelectorAll('.stepper input');
  const idx={s:0,m:1,j:2}[k];
  const ip=inputs[idx];
  if(ip && syncInput) ip.value=EXSET[k];
}
function toggleShuffle(){ EXSET.shuffle=!EXSET.shuffle; saveSet(); examSetup(); }
function toggleShowAns(){ EXSET.showAns=!EXSET.showAns; saveSet(); examSetup(); }
function toggleTimed(){ EXSET.timed=!EXSET.timed; saveSet(); examSetup(); }
function adjMin(d){
  EXSET.mins=Math.max(10, Math.min(300, (Number(EXSET.mins)||60)+d));
  saveSet(); examSetup();
}
function setMin(el){
  const raw=el.value.replace(/\D/g,'');
  if(el.value!==raw) el.value=raw;
  let n=parseInt(raw,10); if(isNaN(n)) n=60;
  EXSET.mins=Math.max(1, Math.min(300, n));
  saveSet();
}
function normMin(el){
  let n=parseInt(el.value,10); if(isNaN(n)) n=60;
  EXSET.mins=Math.max(10, Math.min(300, n));
  saveSet(); el.value=EXSET.mins;
}
function updateSum(){
  const n=EXSET.s+EXSET.m+EXSET.j;
  const el=document.getElementById('sumline'); if(!el) return;
  el.textContent = n>0
    ? '共 '+n+' 题 · 单选 '+EXSET.s+' / 多选 '+EXSET.m+' / 判断 '+EXSET.j
    : '请至少选择 1 题';
}
function startExam(){
  const n=EXSET.s+EXSET.m+EXSET.j;
  if(n<=0){ toast('请先设置题量'); return; }
  const items=[];
  [[1,EXSET.s],[2,EXSET.m],[3,EXSET.j]].forEach(function(pair){
    const t=pair[0], cnt=pair[1];
    if(!cnt) return;
    const ids=shuffleArr(LIB.questions.filter(q=>q.t===t).map(q=>q.n)).slice(0,cnt);
    ids.forEach(function(no){
      const q=byNo(no); if(!q) return;
      const order=q.o.map((_,i)=>i);
      if(EXSET.shuffle && q.t!==3) shuffleArr(order);   // 判断题只有两项，不打乱
      const ans=q.a.map(function(k){
        const orig=k.charCodeAt(0)-65;
        return String.fromCharCode(65+order.indexOf(orig));
      }).sort();
      items.push({n:no, order:order, ans:ans});
    });
  });
  if(!items.length){ toast('没有抽到题目，请检查题量设置'); return; }
  EX={items:items, idx:0, ua:{}, revealed:{}, libId:curId()};
  /* 限时：存绝对时间戳，刷新页面后倒计时能接着走，而不是从头算 */
  if(EXSET.timed) EX.deadline = Date.now() + Math.max(1, Number(EXSET.mins)||60)*60000;
  saveEx(); exam(); window.scrollTo(0,0);
}
function examBroken(){
  stopTick();
  toast('题目已不在题库中，考试已结束');
  EX=null;
  Store.del('exam').catch(function(){ storeWarn('无法清除考试暂存'); });
  home();
}
/* ---------- 考试倒计时 ---------- */
let tickTimer=null;
function stopTick(){ if(tickTimer){ clearInterval(tickTimer); tickTimer=null; } }
function startTick(){
  stopTick();
  if(!EX || !EX.deadline) return;
  updateClock();
  tickTimer=setInterval(updateClock, 1000);
}
function updateClock(){
  const el=document.getElementById('clock');
  if(!EX || !EX.deadline){ stopTick(); return; }
  const left=Math.max(0, EX.deadline-Date.now());
  const sec=Math.ceil(left/1000);
  const m=Math.floor(sec/60), s=sec%60;
  if(el){
    el.textContent=m+':'+(s<10?'0':'')+s;
    el.className='clock'+(sec<=60?' urgent':'');
  }
  if(left<=0){
    stopTick();
    toast('时间到，自动交卷');
    submitExam(true);          // true = 自动交卷，跳过「还有题未作答」的确认
  }
}

function exam(){
  VIEW='exam';
  clearAuto();
  $('#dispBtn').style.display='none';
  if(!EX || !EX.items || !EX.items.length){ return examBroken(); }
  const it=EX.items[EX.idx];
  if(!it){ return examBroken(); }
  const q=byNo(it.n);
  if(!q){ return examBroken(); }          // 题库换过，题号失效

  picked=(EX.ua[EX.idx]||'').split('').filter(Boolean);
  const rv=!!(EX.revealed && EX.revealed[EX.idx]);
  titleEl.innerHTML='考试<span class="sub">'+EX.items.length+' 题</span>';
  backEl.style.display=''; backEl.onclick=function(){ saveEx(); home(); };
  let optsHtml='';
  it.order.forEach(function(oi,i){
    const k=String.fromCharCode(65+i);
    let cls='opt';
    if(rv){
      if(it.ans.includes(k)) cls+=' right';
      else if(picked.includes(k)) cls+=' wrong';
      else cls+=' dim';
    }else if(picked.includes(k)) cls+=' sel';
    optsHtml+='<div class="'+cls+'" data-k="'+k+'" onclick="examPick(\''+k+'\')">'
      + '<div class="k">'+k+'</div><div class="v">'+esc(q.o[oi])+'</div></div>';
  });
  let fbHtml='';
  if(rv){
    fbHtml='<div class="fb no" style="margin-top:10px"><div class="h">✕ 答错了</div>'
      + '<div class="ans">正确答案 <b>'+examAnsShow(q,it,it.ans)+'</b>　你的答案 <b>'+examAnsShow(q,it,picked)+'</b></div>'
      + (q.m?'<div class="memo"><span class="lb">解析</span>'+esc(q.m)+'</div>':'')+'</div>';
  }
  body.innerHTML='<div class="card">'
    + '<div class="meta"><span class="pill '+TYP_CLS[q.t]+'">'+TYP[q.t]+'</span>'
    + (q.t===2?'<span class="pidx">多选，选全得分</span>':'')
    + '<span class="pidx">'+(EX.idx+1)+' / '+EX.items.length+'</span>'
    + (EX.deadline?'<span class="clock" id="clock">--:--</span>':'')
    + '</div>'
    + '<div class="qtext">'+esc(q.q)+'</div>'+optsHtml+fbHtml+'</div>';

  if(EX.deadline) startTick();

  ft.style.display='';
  const last=EX.idx===EX.items.length-1;
  ftin.innerHTML=
      '<button class="fbtn sm" onclick="prevExam()" '+(EX.idx===0?'disabled':'')+'>上一题</button>'
    + (q.t===2&&!rv?'<button class="fbtn" id="btnAllPick" onclick="examPickAll()">'+(picked.length===q.o.length?'清空':'全选')+'</button>':'')
    + '<button class="fbtn" onclick="jumpList()">答题卡</button>'
    + '<button class="fbtn p" onclick="'+(last?'submitExam()':'nextExam()')+'">'+(last?'交卷':'下一题')+'</button>';
}
function examPick(k){
  const it=EX.items[EX.idx];
  const q=byNo(it.n); if(!q){ return examBroken(); }
  if(EX.revealed && EX.revealed[EX.idx]) return;      // 已揭示，锁定
  if(q.t===2){
    const i=picked.indexOf(k);
    if(i>=0) picked.splice(i,1); else picked.push(k);
    EX.ua[EX.idx]=picked.slice().sort().join('');
    saveEx();
    document.querySelectorAll('.opt').forEach(function(el){
      el.classList.toggle('sel', picked.includes(el.dataset.k));
    });
  }else{
    picked=[k];
    EX.ua[EX.idx]=k;
    saveEx();
    const ok = it.ans.length===1 && it.ans[0]===k;
    if(EXSET.showAns && !ok){                        // 答错：停下看答案
      EX.revealed[EX.idx]=true; saveEx(); exam(); return;
    }
    if(EX.idx<EX.items.length-1){ EX.idx++; saveEx(); exam(); window.scrollTo(0,0); }
    else{ exam(); }
  }
}
function examPickAll(){
  const it=EX.items[EX.idx];
  const q=byNo(it.n); if(!q){ return examBroken(); }
  if(EX.revealed && EX.revealed[EX.idx]) return;
  if(q.t!==2) return;
  const all=q.o.map((_,i)=>String.fromCharCode(65+i));
  picked = (picked.length===all.length) ? [] : all;
  EX.ua[EX.idx]=picked.slice().sort().join('');
  saveEx();
  document.querySelectorAll('.opt').forEach(function(el){
    el.classList.toggle('sel', picked.includes(el.dataset.k));
  });
  const b=document.getElementById('btnAllPick');
  if(b) b.textContent = (picked.length===q.o.length) ? '清空' : '全选';
}
function nextExam(){
  const it=EX.items[EX.idx];
  if(!it) return examBroken();
  const q=byNo(it.n);
  if(!q) return examBroken();
  if(q.t===2 && EXSET.showAns && !(EX.revealed&&EX.revealed[EX.idx])){
    const ua=(EX.ua[EX.idx]||'').split('').filter(Boolean).sort().join('');
    const ok = ua && ua===it.ans.slice().sort().join('');
    if(ua && !ok){ EX.revealed[EX.idx]=true; saveEx(); exam(); return; }
  }
  if(EX.idx<EX.items.length-1){ EX.idx++; saveEx(); exam(); window.scrollTo(0,0); }
  else{ submitExam(); }
}
function prevExam(){ if(EX.idx>0){ EX.idx--; saveEx(); exam(); window.scrollTo(0,0); } }
function jumpList(){
  const old=document.getElementById('jumpbox');
  if(old){ old.remove(); return; }
  const html=EX.items.map(function(it,i){
    return '<span class="'+(EX.ua[i]?'done':'')+(i===EX.idx?' cur':'')+'" onclick="jumpTo('+i+')">'+(i+1)+'</span>';
  }).join('');
  body.insertAdjacentHTML('beforeend',
    '<div id="jumpbox" class="card" style="margin-top:12px">'
    + '<div style="font-weight:600;margin-bottom:2px">答题卡</div>'
    + '<div style="font-size:12px;color:#94a3b8;margin-bottom:8px">蓝色为已作答</div>'
    + '<div class="exambar">'+html+'</div></div>');
  const el=document.getElementById('jumpbox');
  if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function jumpTo(i){ EX.idx=i; saveEx(); exam(); window.scrollTo(0,0); }

function submitExam(auto){
  const un=EX.items.length-Object.keys(EX.ua).length;
  if(!auto && un>0 && !confirm('还有 '+un+' 题未作答，确定交卷？')) return;
  stopTick();
  let right=0; const wrong=[]; const stat={1:[0,0],2:[0,0],3:[0,0]};
  EX.items.forEach(function(it,i){
    const q=byNo(it.n);
    if(!q) return;                                   // 题目缺失：不计入统计
    const ua=(EX.ua[i]||'').split('').filter(Boolean).sort().join('');
    const ok= ua===it.ans.slice().sort().join('');
    stat[q.t][1]++; if(ok){ right++; stat[q.t][0]++; } else wrong.push(i);
  });
  const total=EX.items.length;
  EX.result={right:right, total:total, score:total?Math.round(right/total*100):0, wrong:wrong, stat:stat};
  /* 落一条记录：错题存题号 + 当时的选项顺序 + 你选的字母，否则乱序后答案对不上 */
  LOG.unshift({
    t: Date.now(),
    total: total,
    right: right,
    score: EX.result.score,
    wrong: wrong.map(function(i){ return {n:EX.items[i].n, ua:(EX.ua[i]||''), order:EX.items[i].order||null}; })
  });
  if(LOG.length>50) LOG.length=50;
  saveLog();
  saveEx(); examResult(); window.scrollTo(0,0);
}
function examResult(){
  clearAuto(); stopTick();
  const R=EX.result;
  titleEl.innerHTML='考试成绩<span class="sub">'+R.total+' 题</span>';
  backEl.style.display=''; backEl.onclick=exitExam; ft.style.display='';
  const statRows=[1,2,3].map(function(t){
    const s=R.stat[t]; if(!s||!s[1]) return '';
    return '<div class="rrow"><span>'+TYP[t]+'</span><span>'+s[0]+' / '+s[1]
      + '　<b style="color:#2563eb">'+Math.round(s[0]/s[1]*100)+'%</b></span></div>';
  }).join('');

  let wrongHtml='';
  if(R.wrong.length){
    wrongHtml='<div class="tagline">错题回顾（'+R.wrong.length+' 题）</div>'
      + R.wrong.map(function(i){
          const it=EX.items[i], q=byNo(it.n);
          if(!q) return '';
          const ua=(EX.ua[i]||'').split('').filter(Boolean).sort().join('');
          return '<div class="review"><div class="rq">'+esc(q.q)+'</div>'
            + '<div class="ra">你的答案 <b class="bad">'+(ua?examAnsShow(q,it,ua):'未作答')+'</b>'
            + '　正确答案 <b>'+examAnsShow(q,it,it.ans)+'</b></div>'
            + (q.m?'<div class="rm">'+esc(q.m)+'</div>':'')+'</div>';
        }).join('');
  }else{
    wrongHtml='<div class="empty">全部答对，没有错题</div>';
  }

  body.innerHTML='<div class="card"><div class="score">'
    + '<div class="big">'+R.score+'<small>分</small></div>'
    + '<div class="lb">答对 '+R.right+' / '+R.total+' 题</div></div>'+statRows+'</div>'
    + '<button class="btn s" onclick="examLog()" style="margin-top:12px">已记入考试记录（共 '+LOG.length+' 次）</button>'
    + wrongHtml;
  ftin.innerHTML='<button class="fbtn" onclick="examSetup()">再考一次</button>'
    +'<button class="fbtn p" onclick="exitExam()">完成</button>';
}

/* ---------- 考试记录 ---------- */
function fmtWhen(ts){
  const d=new Date(ts), p=n=>(n<10?'0':'')+n;
  return (d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function examLog(){
  titleEl.innerHTML='考试记录<span class="sub">'+LOG.length+' 次</span>';
  backEl.style.display=''; backEl.onclick=home; ft.style.display='none';
  if(!LOG.length){
    body.innerHTML='<div class="empty">还没有考试记录<br>去「模拟考试」考一次，成绩就会记在这里</div>';
    return;
  }
  let rows='';
  LOG.forEach(function(r,i){
    const col=r.score>=80?'#16a34a':(r.score>=60?'#d97706':'#dc2626');
    rows+='<div class="item" onclick="examLogDetail('+i+')">'
      + '<div style="display:flex;align-items:center;gap:12px">'
      + '<div style="min-width:58px;font-size:22px;font-weight:700;color:'+col+'">'+r.score
      + '<span style="font-size:12px;font-weight:400">分</span></div>'
      + '<div style="flex:1"><div style="font-size:13.5px">'+fmtWhen(r.t)+'　对 '+r.right+' / '+r.total+'</div>'
      + '<div style="font-size:12px;color:#64748b;margin-top:2px">错 '+r.wrong.length+' 题</div></div>'
      + '<div style="color:#cbd5e1;font-size:18px">›</div></div></div>';
  });
  body.innerHTML='<div class="card">'+rows+'</div>'
    + '<button class="btn s" onclick="logClear()" style="color:#dc2626;margin-top:14px">清空考试记录</button>';
}
function examLogDetail(i){
  const r=LOG[i]; if(!r){ examLog(); return; }
  titleEl.innerHTML='考试详情<span class="sub">'+r.score+' 分</span>';
  backEl.style.display=''; backEl.onclick=examLog; ft.style.display='';
  let html='<div class="card">'
    + '<div class="kv"><span class="k">时间</span><span class="v">'+new Date(r.t).toLocaleString('zh-CN')+'</span></div>'
    + '<div class="kv"><span class="k">成绩</span><span class="v">'+r.right+' / '+r.total+'　'+r.score+' 分</span></div>'
    + '<div class="kv"><span class="k">错题</span><span class="v">'+r.wrong.length+' 题</span></div></div>';
  if(!r.wrong.length){
    html+='<div class="empty">这次全对，没有错题</div>';
  }else{
    html+='<div class="tagline">错题回顾（'+r.wrong.length+' 题）</div>'
      + r.wrong.map(function(w){
          const q=byNo(w.n); if(!q) return '';
          const order=w.order || q.o.map((_,i)=>i);
          const ua=(w.ua||'').split('').filter(Boolean).sort().join('');
          /* 你的答案的字母是「乱序后」的位置，正解是原始位置 —— 都换算成选项原文再显示 */
          const yourText = ua
            ? ua.split('').map(k=>q.o[order[k.charCodeAt(0)-65]]||k).join(' / ')
            : '未作答';
          const okText = toArr(q.a).sort().map(k=>q.o[k.charCodeAt(0)-65]||k).join(' / ');
          return '<div class="review"><div class="rq">'+esc(q.q)+'</div>'
            + '<div class="ra">你的答案 <b class="bad">'+esc(yourText)+'</b>'
            + '　正确答案 <b>'+esc(okText)+'</b></div>'
            + (q.m?'<div class="rm">'+esc(q.m)+'</div>':'')+'</div>';
        }).join('');
  }
  body.innerHTML=html;
  ftin.innerHTML = r.wrong.length
    ? '<button class="fbtn p" onclick="redoLog('+i+')">重做这 '+r.wrong.length+' 道错题</button>'
    : '';
}
function logClear(){
  if(!LOG.length) return;
  if(!confirm('清空全部考试记录？不影响错题本与练习记录。')) return;
  LOG=[]; saveLog(); toast('已清空考试记录'); examLog();
}
function exitExam(){
  stopTick();
  EX=null;
  Store.del('exam').catch(function(){ storeWarn('无法清除考试暂存'); });
  home(); window.scrollTo(0,0);
}

/* ---------- 旧版单库数据迁移（只在首次运行、没有 meta 时做一次） ---------- */
async function migrateLegacy(){
  let hasMeta=false;
  try{ hasMeta = !!(await Store.get('meta')); }catch(e){}
  if(hasMeta) return;

  let oldLib=null;
  try{
    const raw=localStorage.getItem('wenzai_lib_v1');
    if(raw) oldLib=JSON.parse(raw);
  }catch(e){}
  if(!oldLib || !Array.isArray(oldLib.questions) || !oldLib.questions.length) return;

  const res=validateLib(oldLib);
  if(!res.ok) return;          // 旧库本身不合法就不迁移，免得把坏数据带进新结构

  const id='legacy';
  try{
    await Store.set(libKey(id), res.lib);
    const st=localStorage.getItem('wenzai_v1');
    if(st) await Store.set(stateKey(id), JSON.parse(st));
    const lg=localStorage.getItem('wenzai_exam_log_v1');
    if(lg) await Store.set(logKey(id), JSON.parse(lg));
    const rp=localStorage.getItem('wenzai_recite_v1');
    if(rp) await Store.set(reciteKey(id), parseInt(rp,10)||0);
    const es=localStorage.getItem('wenzai_exset_v2');
    if(es) await Store.set('exset', JSON.parse(es));
  }catch(e){
    return;
  }

  META={v:1, currentId:id, libs:[{
    id:id,
    name:res.lib.name,
    count:res.lib.questions.length,
    cats:res.lib.cats.length,
    createdAt:res.lib.createdAt,
    source:res.lib.source||''
  }]};
  await Store.set('meta', META);

  ['wenzai_lib_v1','wenzai_v1','wenzai_exam_log_v1','wenzai_recite_v1',
   'wenzai_exset_v2','wenzai_exam_v1'].forEach(function(k){
    try{ localStorage.removeItem(k); }catch(e){}
  });
}

/* ---------- 启动 ---------- */
async function boot(){
  await Store.init();
  await migrateLegacy();

  const m=await Store.get('meta');
  if(m && Array.isArray(m.libs)) META=m;
  if(!Array.isArray(META.libs)) META.libs=[];

  const es=await Store.get('exset');
  EXSET=Object.assign(EMPTY_EXSET(), es || {});
  EX=await Store.get('exam');

  // 显示设置要在首次渲染前应用，否则会先闪一下默认主题
  const dp=await Store.get('display');
  if(dp && typeof dp==='object'){
    DISP={ theme:dp.theme||'default', fs:dp.fs||'m' };
  }
  applyDisp();
  LAST_BACKUP = Number(await Store.get('lastBackup')) || 0;

  if(META.currentId && META.libs.some(function(l){ return l.id===META.currentId; })){
    await loadLibData(META.currentId);
  }else if(META.libs.length){
    await loadLibData(META.libs[0].id);
  }else{
    LIB=null;
    buildIdx();
  }
  home();
}

const __ready = boot().catch(function(e){
  storeWarn('初始化失败：'+((e && e.message) || e));
  LIB=null; buildIdx(); home();
});

/* ---------- PWA 注册 ----------
   只在 https / localhost 下能注册成功；用 file:// 双击打开时静默跳过，
   页面本来就零外链，照样能刷题，只是没有「装到主屏」这一层。 */
if(typeof navigator!=='undefined' && typeof location!=='undefined'
   && 'serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* 注册失败不影响使用 */ });
  });
}
