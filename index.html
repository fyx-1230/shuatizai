<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-title" content="刷题仔">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>刷题仔</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  /* 字号档位由 data-fs 控制，默认中号 */
  --fs:16px; --fs-q:17px; --fs-o:15px;
  background:#f1f5f9;color:#0f172a;font-size:var(--fs);line-height:1.6;
  overscroll-behavior-y:contain;
  /* 去掉快速连点触发的双击缩放；安卓上还能省掉 300ms 点击延迟 */
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}

/* 字号档位：正文字号、题干字号、选项字号三者等比缩放 */
body[data-fs="s"]{ --fs:15px; --fs-q:16px;   --fs-o:14px }
body[data-fs="m"]{ --fs:16px; --fs-q:17px;   --fs-o:15px }
body[data-fs="l"]{ --fs:17px; --fs-q:18.5px; --fs-o:16px }
body[data-fs="xl"]{ --fs:19px; --fs-q:21px;  --fs-o:18px }
.wrap{max-width:680px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.hd{
  position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e2e8f0;
  padding:12px 16px;display:flex;align-items:center;gap:10px;padding-top:calc(12px + env(safe-area-inset-top));
}
.hd h1{font-size:17px;margin:0;font-weight:600;flex:1}
.hd .sub{font-size:12px;color:#64748b;font-weight:400;margin-left:6px}
.back{
  border:0;background:#f1f5f9;color:#334155;border-radius:10px;padding:12px 14px;
  font-size:14px;line-height:1.4;font-family:inherit;cursor:pointer;
  min-height:44px;display:inline-flex;align-items:center;
}
.back:active{background:#e2e8f0}
.body{flex:1;padding:14px 14px 120px}

/* 首页搜索 */
.searchbar{padding:0 0 12px}
.searchbar input{
  width:100%;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;
  /* 必须 ≥16px：低于这个值 iOS Safari 聚焦输入框时会强制放大整个页面且不还原 */
  font-size:16px;font-family:inherit;background:#fff;color:#0f172a;
}
.searchbar input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.searchbar input::-webkit-search-cancel-button{-webkit-appearance:none}
.item mark{background:#fef08a;color:inherit;border-radius:3px;padding:0 1px}

/* 首页 */
.hero{text-align:center;padding:22px 0 12px}
.hero .t{font-size:24px;font-weight:700;letter-spacing:.5px}
.hero .d{color:#64748b;font-size:13px;margin-top:6px}
.btn{
  display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;
  font-family:inherit;font-weight:600;cursor:pointer;margin-bottom:10px;
}
.btn.p{background:#2563eb;color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.28)}
.btn.p:active{background:#1d4ed8}
.btn.s{background:#fff;color:#334155;border:1px solid #e2e8f0}
.btn.s:active{background:#f8fafc}
.btn .tag{font-weight:400;font-size:12px;color:#94a3b8;margin-left:8px}
.btn.p .tag{color:rgba(255,255,255,.8)}
.btn.big{padding:17px 15px;font-size:17px;margin-bottom:14px}

/* 首页题库卡 */
.libcard{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e2e8f0;
  border-radius:14px;padding:13px 14px;margin-bottom:14px}
.libcard.blank{border-style:dashed;background:#fbfcfe}
.libico{width:38px;height:38px;border-radius:11px;background:#eff6ff;color:#2563eb;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.libcard.blank .libico{background:#f1f5f9;color:#94a3b8}
.libbody{flex:1;min-width:0}
.libname{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libmeta{font-size:11.5px;color:#94a3b8;margin-top:3px}
.libact{border:1px solid #e2e8f0;background:#fff;color:#475569;border-radius:9px;
  padding:9px 13px;font-size:12.5px;font-family:inherit;cursor:pointer;min-height:40px;flex:0 0 auto}
.libact:active{background:#f8fafc}

/* 首页功能网格 */
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.act{background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:13px 14px;cursor:pointer}
.act:active{background:#f8fafc}
.act b{display:block;font-size:14px;font-weight:600;color:#0f172a}
.act span{display:block;font-size:11.5px;color:#94a3b8;margin-top:3px}
.act.dis{opacity:.42;cursor:not-allowed}
.hintline{font-size:12.5px;color:#94a3b8;text-align:center;padding:20px 12px;background:#fff;
  border:1px dashed #e2e8f0;border-radius:13px;margin-bottom:14px;line-height:1.7}
.noteinput{width:100%;min-height:130px;border:1px solid #e2e8f0;border-radius:12px;padding:12px;
  font-family:inherit;font-size:16px;line-height:1.6;color:#0f172a;background:#fff;resize:vertical}
.noteinput:focus{outline:none;border-color:#2563eb}
.backup-tip{display:flex;align-items:center;gap:8px;background:#fffbeb;border:1px solid #fde68a;
  color:#92400e;border-radius:12px;padding:11px 13px;font-size:12.5px;margin-bottom:12px;cursor:pointer;line-height:1.5}
.notebox{margin-top:12px;background:#f8fafc;border-left:3px solid #cbd5e1;border-radius:0 10px 10px 0;
  padding:10px 12px;font-size:13px;color:#475569;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.notebox b{display:block;font-size:11.5px;color:#94a3b8;font-weight:600;margin-bottom:3px}
.sec-t{font-size:13px;color:#64748b;margin:22px 2px 10px;font-weight:600;letter-spacing:.3px}
/* 列宽必须写 minmax(0,1fr)：1fr 的最小尺寸是内容宽，
   分类名加了 nowrap 后会把整列顶宽、把右侧数字挤出屏幕 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{
  background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:13px 14px;
  cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-width:0;
}
.cat:active{background:#f8fafc}
.cat .n{font-size:14px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.cat .c{font-size:12px;color:#94a3b8;flex:0 0 auto}
.row{display:flex;gap:10px}
.row>*{flex:1}
.mini{
  background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:14px;text-align:center;cursor:pointer;
}
.mini:active{background:#f8fafc}
.mini .v{font-size:22px;font-weight:700;color:#2563eb}
.mini .l{font-size:12px;color:#64748b;margin-top:2px}
.row.muted .mini .v{color:#cbd5e1}

/* 题库列表 */
.libbox{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0}
.librow{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #f1f5f9}
.librow:last-child{border-bottom:0}
.librow.on{background:#eff6ff}
.libmain{flex:1;cursor:pointer;min-width:0}
.lbname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbtag{font-size:11px;color:#2563eb;background:#dbeafe;border-radius:20px;padding:1px 7px;
  margin-left:6px;font-weight:600;vertical-align:middle}
.lbmeta{font-size:12px;color:#94a3b8;margin-top:3px}
.libbtn{border:1px solid #e2e8f0;background:#fff;color:#475569;border-radius:9px;padding:8px 10px;
  font-size:12.5px;font-family:inherit;cursor:pointer;min-height:40px;flex:0 0 auto}
.libbtn:active{background:#f8fafc}
.libbtn.del{color:#dc2626;border-color:#fecaca}
.storage-tip{font-size:12px;color:#94a3b8;text-align:center;margin-top:14px}

/* 题目 */
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.meta{display:flex;align-items:center;gap:8px;margin-bottom:11px;font-size:12px}
.pill{background:#eff6ff;color:#2563eb;padding:3px 9px;border-radius:20px;font-weight:600}
.pill.g{background:#f0fdf4;color:#16a34a}
.pill.o{background:#fff7ed;color:#ea580c}
.pidx{color:#94a3b8;margin-left:auto}
.qbar{height:3px;background:#eef2f7;border-radius:3px;overflow:hidden;margin:-2px 0 13px}
.qbar>i{display:block;height:100%;min-width:2px;background:linear-gradient(90deg,#93c5fd,#2563eb);border-radius:3px;transition:width .25s}
.qtext{font-size:var(--fs-q);line-height:1.7;font-weight:500;margin:0 0 16px;white-space:pre-wrap;word-break:break-word}
.opt{
  display:flex;gap:11px;align-items:flex-start;background:#fff;border:1.5px solid #e2e8f0;
  border-radius:13px;padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:.15s;
}
.opt:active{background:#f8fafc}
.opt .k{
  flex:0 0 24px;height:24px;border-radius:7px;background:#f1f5f9;color:#64748b;
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.opt .v{flex:1;font-size:var(--fs-o);line-height:1.55;word-break:break-word}
.opt.sel{border-color:#2563eb;background:#eff6ff}
.opt.sel .k{background:#2563eb;color:#fff}
.opt.right{border-color:#16a34a;background:#f0fdf4}
.opt.right .k{background:#16a34a;color:#fff}
.opt.wrong{border-color:#dc2626;background:#fef2f2}
.opt.wrong .k{background:#dc2626;color:#fff}
.opt.dim{opacity:.55}

.fb{border-radius:14px;padding:14px;margin-top:6px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fb.ok{background:#f0fdf4;border:1px solid #bbf7d0}
.fb.no{background:#fef2f2;border:1px solid #fecaca}
.fb .h{font-weight:700;font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.fb.ok .h{color:#15803d}
.fb.no .h{color:#b91c1c}
.fb .ans{font-size:13px;color:#475569;margin-bottom:8px}
.fb .ans b{color:#0f172a}
.fb .hint{font-size:12px;color:#16a34a;margin-top:5px;opacity:.85}
@keyframes fadebar{from{width:0}to{width:100%}}
.autobar{height:3px;background:#bbf7d0;border-radius:3px;margin-top:8px;overflow:hidden}
.autobar>i{display:block;height:100%;background:#16a34a;border-radius:3px;animation:fadebar .9s linear forwards}
.memo{
  background:#fffbeb;border-left:3px solid #f59e0b;border-radius:0 9px 9px 0;
  padding:10px 12px;font-size:14.5px;line-height:1.65;color:#422006;
}
.memo .lb{font-size:11px;color:#a16207;font-weight:700;display:block;margin-bottom:3px;letter-spacing:.5px}

/* 底部栏 */
.ft{
  position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);border-top:1px solid #e2e8f0;z-index:30;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}
.ft .in{max-width:680px;margin:0 auto;display:flex;gap:10px}
.fbtn{
  flex:1;border:1px solid #e2e8f0;background:#fff;border-radius:12px;padding:13px;
  font-size:15px;font-family:inherit;font-weight:600;color:#334155;cursor:pointer;
}
.fbtn:active{background:#f1f5f9}
.fbtn.p{background:#2563eb;color:#fff;border-color:#2563eb;flex:2}
.fbtn.p:active{background:#1d4ed8}
.fbtn:disabled{opacity:.45}
.fbtn.sm{flex:0 0 auto;padding:13px 16px}

/* 列表 */
.item{
  background:#fff;border-radius:13px;padding:13px 14px;margin-bottom:9px;cursor:pointer;
  border:1px solid #e2e8f0;
}
.item:active{background:#f8fafc}
.item .q{font-size:14.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{font-size:12px;color:#94a3b8;margin-top:5px}
.empty{text-align:center;color:#94a3b8;padding:60px 20px;font-size:14px}

/* 统计 */
.stat-card{background:#fff;border-radius:16px;padding:18px;margin-bottom:12px}
.bar{height:9px;background:#e2e8f0;border-radius:9px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:9px;transition:width .4s}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-bottom:1px solid #f1f5f9}
.kv:last-child{border:0}
.kv .k{color:#64748b}
.kv .v{font-weight:600}
.toast{
  position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%);
  background:rgba(15,23,42,.88);color:#fff;padding:9px 18px;border-radius:20px;font-size:13.5px;
  z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:86vw;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.toast.on{opacity:1}

/* 考试设置 */
.setrow{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid #f1f5f9}
.setrow:last-child{border-bottom:0}
.sl{font-size:15px;font-weight:600}
.sc{font-size:12px;color:#94a3b8;margin-top:3px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{
  width:38px;height:38px;border-radius:11px;border:1px solid #e2e8f0;background:#fff;
  font-size:14px;font-weight:700;color:#334155;font-family:inherit;cursor:pointer;
}
.stepper button:active{background:#f1f5f9}
.stepper button:disabled{opacity:.35}
.stepper .num{font-size:19px;font-weight:700;min-width:46px;text-align:center;color:#2563eb;font-variant-numeric:tabular-nums}
.stepper input{
  width:62px;height:38px;text-align:center;font-size:19px;font-weight:700;color:#2563eb;
  border:1px solid #e2e8f0;border-radius:11px;background:#f8fafc;font-family:inherit;
  font-variant-numeric:tabular-nums;padding:0 2px;
}
.stepper input:focus{outline:none;border-color:#2563eb;background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.switch{width:50px;height:30px;border-radius:30px;background:#cbd5e1;position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
.switch.on{background:#2563eb}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on i{left:23px}
.sumline{background:#eff6ff;border-radius:12px;padding:13px 14px;font-size:14px;color:#1e40af;margin-top:14px;text-align:center}

/* 考试结果 */
.score{text-align:center;padding:24px 0 18px}
.score .big{font-size:54px;font-weight:800;color:#2563eb;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:20px;font-weight:600;color:#93c5fd}
.score .lb{font-size:13px;color:#64748b;margin-top:8px}
.rrow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
.rrow:last-child{border:0}
.review{background:#fff;border-radius:13px;padding:14px;margin-bottom:10px;border:1px solid #e2e8f0}
.review .rq{font-size:14.5px;line-height:1.55;margin-bottom:9px}
.review .ra{font-size:13px;color:#64748b;margin-bottom:8px}
.review .ra b{color:#16a34a}
.review .ra b.bad{color:#dc2626}
.review .rm{background:#fffbeb;border-left:3px solid #f59e0b;border-radius:0 8px 8px 0;padding:9px 11px;font-size:13.5px;line-height:1.6;color:#422006}
.tagline{font-size:12px;color:#94a3b8;margin:18px 2px 10px;font-weight:600}
.exambar{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.exambar span{position:relative;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;background:#f1f5f9;color:#64748b;cursor:pointer}
/* 视觉 34px，热区撑到 44px，手机上不容易点错 */
.exambar span::after{content:'';position:absolute;inset:-5px;border-radius:10px}
.exambar span.done{background:#dbeafe;color:#1d4ed8;font-weight:600}
.exambar span.cur{outline:2px solid #2563eb;outline-offset:1px}
.exambar span.ok{background:#dcfce7;color:#15803d;font-weight:600}
.exambar span.no{background:#fee2e2;color:#b91c1c;font-weight:600}

/* 答题卡抽屉（练习 / 背题共用） */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;
  border-top:1px solid #e2e8f0;border-radius:16px 16px 0 0;
  box-shadow:0 -8px 28px rgba(15,23,42,.14);max-height:72%;display:flex;flex-direction:column;
  animation:fade .18s ease;
}
.sheet-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #eef2f7}
.sheet-hd b{font-size:15px}
.sheet-hd span{font-size:12px;color:#64748b;flex:1;text-align:right}
.sheet-hd button{border:0;background:#f1f5f9;color:#334155;border-radius:10px;padding:11px 14px;
  font-size:13px;font-family:inherit;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.sheet-bd{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 14px 14px;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* 答题卡分页条 */
.card-pager{display:flex;align-items:center;gap:10px;flex:0 0 auto;
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #eef2f7}
.pbtn{flex:1;border:1px solid #e2e8f0;background:#fff;border-radius:10px;padding:10px;
  font-size:13.5px;font-family:inherit;color:#334155;cursor:pointer;min-height:44px}
.pbtn:active{background:#f8fafc}
.pbtn:disabled{opacity:.4}
.pinfo{font-size:12px;color:#94a3b8;flex:0 0 auto;font-variant-numeric:tabular-nums;text-align:center}

/* 帮助页 */
.doc{background:#fff;border-radius:16px;padding:16px;font-size:14.5px;line-height:1.85}
.doc h3{font-size:15px;margin:18px 0 8px;font-weight:700}
.doc h3:first-child{margin-top:0}
.doc code{background:#f1f5f9;border-radius:5px;padding:2px 6px;font-size:13px;
  font-family:ui-monospace,Consolas,monospace}
.doc pre{background:#0f172a;color:#e2e8f0;border-radius:11px;padding:13px;overflow-x:auto;
  font-size:12px;line-height:1.6;font-family:ui-monospace,Consolas,monospace;margin:8px 0 0}

/* 考试倒计时 */
.clock{
  font-size:12px;font-weight:700;color:#b45309;background:#fff7ed;
  border-radius:20px;padding:3px 9px;font-variant-numeric:tabular-nums;
  font-family:ui-monospace,Consolas,monospace;
}
.clock.urgent{background:#fef2f2;color:#b91c1c;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

/* ---------- 背景主题 ----------
   只换背景与文字色，主色（蓝）与对错语义色（绿/红）保持不变，
   避免主题切换后「答对/答错」的视觉提示失真。 */
body[data-theme="warm"]{background:#f6f1e7;color:#2e2619}
body[data-theme="warm"] .hd,
body[data-theme="warm"] .card,
body[data-theme="warm"] .cat,
body[data-theme="warm"] .act,
body[data-theme="warm"] .mini,
body[data-theme="warm"] .libcard,
body[data-theme="warm"] .libbox,
body[data-theme="warm"] .btn.s,
body[data-theme="warm"] .searchbar input,
body[data-theme="warm"] .sheet,
body[data-theme="warm"] .opt,
body[data-theme="warm"] .ft .in{background:#fffdf9;border-color:#e8dfd0}
body[data-theme="warm"] .qtext,
body[data-theme="warm"] .opt .v,
body[data-theme="warm"] .act b,
body[data-theme="warm"] .libname,
body[data-theme="warm"] .mini .v,
body[data-theme="warm"] h1{color:#2e2619}
body[data-theme="warm"] .libmeta,
body[data-theme="warm"] .act span,
body[data-theme="warm"] .mini .l,
body[data-theme="warm"] .hero .d,
body[data-theme="warm"] .sec-t,

<script>
'use strict';

/* ==========================================================
   刷题仔 · 本地刷题工具
   题库不再内嵌，改为导入 JSON（由 tools/xlsx2json.py 生成）
   数据全部存在本机 localStorage，无网络请求、无后端
   ========================================================== */

/* ---------- 存储 ----------
   主存储用 IndexedDB（实测 file:// / http:// 两种协议下都可用），
   打不开时自动降级到 localStorage —— 降级后容量小很多，会在界面上标出来。
   内存里同步读写、异步落盘：单用户小数据量，这样既不用把 300 处调用改成 await，
   也不会因为写盘慢卡住界面。 */
const DB_NAME='wenzai', DB_VER=1, DB_STORE='kv';
const LS_PREFIX='wz:';
const EMPTY_S=()=>({answers:{},wrong:[],fav:[],notes:{},pos:0,queue:[],qidx:0,done:0,right:0});
const EMPTY_EXSET=()=>({s:60,m:40,j:60,shuffle:false,showAns:true,timed:false,mins:60});

let storeWarned=false;
function storeWarn(msg){
  if(storeWarned) return;          // 只提示一次，避免刷屏
  storeWarned=true;
  try{ toast(msg); }catch(e){}
}

const Store={
  mode:'ls',                       // 'idb' | 'ls'
  db:null,

  async init(){
    if(typeof indexedDB==='undefined'){ this.mode='ls'; return; }
    try{
      this.db=await this._open();
      this.mode='idb';
    }catch(e){
      this.db=null;
      this.mode='ls';
      storeWarn('IndexedDB 打不开，已降级到 localStorage（容量较小）');
    }
  },
  _open(){
    return new Promise((res,rej)=>{
      let settled=false;
      const ok=function(db){ if(!settled){ settled=true; res(db); } };
      const no=function(err){ if(!settled){ settled=true; rej(err); } };
      let req;
      try{ req=indexedDB.open(DB_NAME, DB_VER); }
      catch(e){ return no(e); }
      req.onupgradeneeded=function(e){
        const db=e.target.result;
        if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      };
      req.onsuccess=function(e){ ok(e.target.result); };
      req.onerror=function(){ no(req.error || new Error('打开数据库失败')); };
      req.onblocked=function(){ no(new Error('数据库被其它标签页占用')); };
      setTimeout(function(){ no(new Error('打开数据库超时')); }, 5000);
    });
  },
  _os(mode){
    const tx=this.db.transaction(DB_STORE, mode);
    return tx.objectStore(DB_STORE);
  },
  get(k){
    if(this.mode!=='idb'){
      try{
        const raw=localStorage.getItem(LS_PREFIX+k);
        return Promise.resolve(raw===null ? null : JSON.parse(raw));
      }catch(e){
        storeWarn('本地数据读取失败，已使用空白记录');
        return Promise.resolve(null);
      }
    }
    return new Promise((res,rej)=>{
      let r;
      try{ r=this._os('readonly').get(k); }catch(e){ return rej(e); }
      r.onsuccess=function(){ res(r.result===undefined ? null : r.result); };
      r.onerror=function(){ rej(r.error); };
    });
  },
  set(k,v){
    if(this.mode!=='idb'){
      try{ localStorage.setItem(LS_PREFIX+k, JSON.stringify(v)); return Promise.resolve(); }
      catch(e){ return Promise.reject(e); }
    }
    return new Promise((res,rej)=>{
      let r;
      try{ r=this._os('readwrite').put(v, k); }catch(e){ return rej(e); }
      r.onsuccess=function(){ res(); };
      r.onerror=function(){ rej(r.error); };
    });
  },
  del(k){
    if(this.mode!=='idb'){
      try{ localStorage.removeItem(LS_PREFIX+k); }catch(e){}
      return Promise.resolve();
    }
    return new Promise((res,rej)=>{
      let r;
      try{ r=this._os('readwrite').delete(k); }catch(e){ return rej(e); }
      r.onsuccess=function(){ res(); };
      r.onerror=function(){ rej(r.error); };
    });
  },
  modeName(){ return this.mode==='idb' ? 'IndexedDB' : 'localStorage'; }
};

/* 落盘：失败只提示一次，不打断继续使用 */
function put(k,v){
  Store.set(k,v).catch(function(e){
    storeWarn('保存失败：'+(e && e.message ? e.message : '存储写入异常'));
  });
}

/* ---------- 多题库键名 ---------- */
function libKey(id){ return 'lib:'+id; }
function stateKey(id){ return 'state:'+id; }
function logKey(id){ return 'log:'+id; }
function reciteKey(id){ return 'recite:'+id; }
function newLibId(){ return 'lib'+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36); }
function curId(){ return META.currentId || ''; }

function save(){ if(curId()) put(stateKey(curId()), S); }
function saveLog(){ if(curId()) put(logKey(curId()), LOG); }
function saveR(){ if(curId()) put(reciteKey(curId()), RIPOS); }
function saveEx(){ put('exam', EX); }
function saveSet(){ put('exset', EXSET); }
function saveMeta(){ put('meta', META); }
function saveLib(){ if(curId()) put(libKey(curId()), LIB); }

/* ---------- 工具 ---------- */
const $ = s=>document.querySelector(s);
const body=$('#body'), ft=$('#ft'), ftin=$('#ftin'), titleEl=$('#title'), subEl=$('#sub'), backEl=$('#back');

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
let toastT;
function toast(msg){
  const t=$('#toast'); if(!t) return;
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200);
}
function pct(a,b){ return b? Math.round(a/b*100):0; }
function toArr(x){ return Array.isArray(x) ? x.slice() : String(x||'').split('').filter(Boolean); }

/* ---------- 题库模型 ---------- */
let META={v:1, currentId:'', libs:[]};   // libs: [{id,name,count,cats,createdAt,source}]
let LIB=null;              // {name,source,createdAt,questions:[],cats:[{n,c}]}
let IDX=new Map();         // 题号 -> 题目
let POOL={1:0,2:0,3:0};    // 各题型题量

function buildIdx(){
  IDX=new Map();
  POOL={1:0,2:0,3:0};
  if(!LIB) return;
  LIB.questions.forEach(q=>{
    IDX.set(q.n, q);
    if(POOL[q.t]!==undefined) POOL[q.t]++;
  });
}
function byNo(no){ return IDX.get(no); }
function hasLib(){ return !!(LIB && LIB.questions && LIB.questions.length); }

const TYP={1:'单选题',2:'多选题',3:'判断题'};
const TYP_CLS={1:'',2:'o',3:'g'};

/* 导入校验：外部数据的唯一防线。任何一题不合法就整份拒绝。 */
function validateLib(o){
  const errs=[];
  if(!o || typeof o!=='object' || Array.isArray(o)) return {ok:false, errs:['文件内容不是题库 JSON 对象']};
  const arr = o.questions || o.data;
  if(!Array.isArray(arr)) return {ok:false, errs:['缺少 questions 数组']};
  if(!arr.length) return {ok:false, errs:['题库里没有题目']};

  const out=[], seen=new Set();
  const push=function(msg){ if(errs.length<50) errs.push(msg); };
  arr.forEach((q,i)=>{
    const tag='第 '+(i+1)+' 题';
    if(!q || typeof q!=='object'){ push(tag+'：格式错误'); return; }
    const n=Number(q.n), t=Number(q.t);
    if(!Number.isFinite(n)){ push(tag+'：题号缺失或不是数字'); return; }
    if(seen.has(n)){ push(tag+'：题号 '+n+' 重复'); return; }
    if(!TYP[t]){ push(tag+'：题型 '+esc(q.t)+' 不合法（应为 1/2/3）'); return; }
    const text=String(q.q==null?'':q.q).trim();
    if(!text){ push(tag+'：题干为空'); return; }
    const opts=Array.isArray(q.o) ? q.o.map(x=>String(x==null?'':x)) : [];
    if(!opts.length){ push(tag+'：没有选项'); return; }
    if(opts.some(x=>!x.trim())){ push(tag+'：存在空选项'); return; }
    const letters=opts.map((_,k)=>String.fromCharCode(65+k));
    const ans=toArr(q.a);
    if(!ans.length){ push(tag+'：答案为空'); return; }
    const bad=ans.filter(k=>!letters.includes(k));
    if(bad.length){ push(tag+'：答案 '+bad.join('')+' 超出选项范围（共 '+opts.length+' 项）'); return; }
    seen.add(n);
    out.push({ n:n, t:t, q:text, o:opts, a:ans, m:String(q.m==null?'':q.m), c:String(q.c==null?'':q.c) });
  });

  /* 严格模式：只要有一题不合法就整份拒绝。
     宁可让用户看到明确的错误，也不能默默少几百题却提示「导入成功」。 */
  if(errs.length) return {ok:false, errs:errs, total:arr.length};
  if(!out.length) return {ok:false, errs:['题库里没有题目']};

  const cm=new Map();
  out.forEach(q=>{ const k=q.c || '未分类'; cm.set(k, (cm.get(k)||0)+1); });
  const cats=Array.from(cm.entries()).map(([n,c])=>({n:n, c:c}));

  return {
    ok:true,
    errs:errs,
    lib:{
      name:String(o.name||'导入题库'),
      source:String(o.source||''),
      createdAt:o.createdAt||new Date().toISOString(),
      questions:out,
      cats:cats
    }
  };
}

/* ---------- 状态（由 boot 从存储载入，这里只给初值） ---------- */
let S = EMPTY_S();
let RIPOS = 0;
/* 上次导出备份的时间戳。0 表示从没导出过 */
let LAST_BACKUP = 0;

/* ---------- 首页 ---------- */
function home(){
  VIEW='home';
  clearAuto();
  stopTick();
  setCardBtn('');
  backEl.style.display='none'; ft.style.display='none';
  $('#dispBtn').style.display='';

  const has = hasLib();
  const total = has ? LIB.questions.length : 0;
  const cats = has ? LIB.cats : [];
  const answered = has ? Object.keys(S.answers).length : 0;
  const acc = pct(S.right, S.done);
  const canResume = has && S.queue && S.queue.length && S.qidx>0 && S.qidx<S.queue.length;

  titleEl.innerHTML = '刷题仔<span class="sub">'+(has ? total+' 题' : '未导入题库')+'</span>';

  const icoBook = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';
  const icoPlus = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

  const libCard = '<div class="libcard'+(has?'':' blank')+'">'
    + '<div class="libico">'+(has?icoBook:icoPlus)+'</div>'
    + '<div class="libbody">'
    +   '<div class="libname">'+esc(has ? LIB.name : '还没有题库')+'</div>'
    +   '<div class="libmeta">'+(has
          ? total+' 题 · '+cats.length+' 个分类 · 已答 '+answered+' 题'
          : '支持 .xlsx / .xlsm / .json')+'</div>'
    + '</div>'
    + (has ? '<button class="libact" onclick="libMenu()">切换</button>' : '')
    + '</div>';

  /* iOS 会清理站点数据，练习记录没了就找不回来。
     有作答记录、但超过 7 天没导出时给一条提醒（从没导出过也算）。 */
  let backupTip = '';
  if(has && answered > 0){
    const days = LAST_BACKUP ? Math.floor((Date.now() - LAST_BACKUP) / 86400000) : -1;
    if(days < 0){
      backupTip = '<div class="backup-tip" onclick="exportBackup()">'
        + '还没备份过。手机浏览器可能清理站点数据，导出一次更保险 →</div>';
    }else if(days >= 7){
      backupTip = '<div class="backup-tip" onclick="exportBackup()">'
        + '已经 '+days+' 天没备份了，建议导出一份 →</div>';
    }
  }

  let mainAct;
  if(!has){
    mainAct = '<button class="btn p big" onclick="pickLib()">导入题库<span class="tag">选 Excel 或 JSON</span></button>';
  }else if(canResume){
    mainAct = '<button class="btn p big" onclick="resume()">继续练习<span class="tag">第 '+(S.qidx+1)+' / '+S.queue.length+' 题</span></button>';
  }else{
    mainAct = '<button class="btn p big" onclick="startAll()">开始练习<span class="tag">顺序 '+total+' 题</span></button>';
  }

  const dis = has ? '' : ' dis';
  const on = function(fn){ return has ? ' onclick="'+fn+'"' : ' onclick="needLib()"'; };
  const logOn = !has ? ' onclick="needLib()"'
    : (LOG.length ? ' onclick="go(\'exlog\')"' : ' onclick="toast(\'还没有考试记录\')"');

  const acts = '<div class="acts">'
    + '<div class="act'+dis+'"'+on('startRandom()')+'><b>随机练习</b><span>打乱顺序</span></div>'

   只更新 #sres 并隐藏 #hmain，不重绘整个 body，

function hi(text, kw){
  const s=String(text||'');
  if(!kw) return esc(s);
  const i=s.toLowerCase().indexOf(kw.toLowerCase());
  if(i<0) return esc(s);
  return esc(s.slice(0,i)) + '<mark>' + esc(s.slice(i,i+kw.length)) + '</mark>' + esc(s.slice(i+kw.length));
}
function onSearchInput(v){
  const kw=String(v||'').trim();
  const res=document.getElementById('sres');
  const main=document.getElementById('hmain');
  if(!res || !main) return;
  if(!kw){ res.innerHTML=''; main.style.display=''; return; }
  main.style.display='none';
  res.innerHTML=renderSearch(kw);
}
function renderSearch(kw){
  const low=kw.toLowerCase();
  const hits=LIB.questions.filter(function(q){
    if(String(q.n)===kw) return true;
    if(String(q.q||'').toLowerCase().indexOf(low)>=0) return true;
    if(String(q.c||'').toLowerCase().indexOf(low)>=0) return true;
    return (q.o||[]).some(function(o){ return String(o).toLowerCase().indexOf(low)>=0; });
  });
  if(!hits.length) return '<div class="empty">没有匹配「'+esc(kw)+'」的题目</div>';
  const MAX=100;
  const head='<div class="sec-t">找到 '+hits.length+' 题'
    + (hits.length>MAX?'（只显示前 '+MAX+' 条）':'')+'</div>';
  return head + hits.slice(0,MAX).map(function(q){
    return '<div class="item" onclick="openOne('+q.n+')">'
      + '<div class="q">'+hi(q.q,kw)+'</div>'
      + '<div class="m">'+esc(q.c||'')+' · 第 '+q.n+' 题</div></div>';
  }).join('');
}

let importMode='lib';
const fileInput=document.getElementById('filePick');

function pickLib(){
  // 现在是「新增一个库」，不动现有题库和记录，所以不需要确认
  importMode='lib';

function pickBackup(){

/* 两个入口共用一个输入框：按扩展名分发到 Excel 解析或 JSON 解析。
   这里故意不设 accept 属性 —— 部分系统（尤其 iOS）会按 MIME 把 .xlsx 置灰，
   导致明明支持却选不了。改为不限制选择，选完按扩展名判断并给出明确提示。 */
fileInput.addEventListener('change', function(e){
  const f=e.target.files && e.target.files[0];
  e.target.value='';              // 允许连续选同一个文件
  if(!f) return;

  const name=String(f.name||'').toLowerCase();

  if(/\.(xlsx|xlsm)$/.test(name)) return importXlsx(f);
  if(/\.json$/.test(name)) return importJson(f);
  if(/\.xls$/.test(name)) return toast('老式 .xls 不支持，请在 Excel 里另存为 .xlsx 再选');
  if(/\.csv$/.test(name)) return toast('CSV 暂不支持，请用 .xlsx 或 JSON');
  return toast('不支持这个文件类型，请选 .xlsx 或 .json');
});

/* Excel 直接导入：浏览器里解 zip、读单元格、按同一套规则归一化 */
function importXlsx(f){
  if(importMode==='backup'){ return toast('备份文件只能是 JSON'); }
  toast('正在解析 Excel…');

  const reader=new FileReader();
  reader.onload=function(){
    xlsxToRows(reader.result).then(function(rows){
      const res=rowsToLib(rows, f.name);
      const suffix = res.errors.length
        ? '，跳过 '+res.errors.length+' 行（'+res.errors[0].replace(/^第 \d+ 行：/,'')+'）'
        : '';
      return applyLib(res.lib, { suffix:suffix });
    }).catch(function(err){
      toast('Excel 解析失败：'+(err && err.message ? err.message : '未知错误'));
    });
  };
  reader.onerror=function(){ toast('文件读取失败'); };
  reader.readAsArrayBuffer(f);
}

function importJson(f){
  const r=new FileReader();
  r.onload=function(){
    let text=String(r.result||'');
    if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);   // 去 BOM
    let obj;
    try{ obj=JSON.parse(text); }
    catch(err){ return toast('不是合法的 JSON 文件'); }
    let p;
    try{
      p = (importMode==='backup') ? applyBackup(obj) : applyLib(obj);
    }catch(err){
      return toast('处理失败：'+(err && err.message ? err.message : '未知错误'));
    }
    if(p && typeof p.catch==='function'){
      p.catch(function(err){ toast('处理失败：'+(err && err.message ? err.message : '未知错误')); });
    }
  };
  r.onerror=function(){ toast('文件读取失败'); };
  r.readAsText(f,'utf-8');
}

/* ==========================================================
   浏览器端 xlsx 解析
   xlsx 本质是 zip + xml。这里解压 xl/worksheets/*.xml 与 sharedStrings.xml，
   再用正则取单元格（不用 DOMParser —— 正则版能在 Node 里跑，可以直接单测）。
   解压依赖浏览器原生 DecompressionStream（Chrome 103+ / Safari 16.4+）。
   ========================================================== */

/* 从文件尾往前找 EOCD，拿中央目录 */
function zipEntries(buf){
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  let eocd = -1;
  const floor = Math.max(0, u8.length - 65558);
  for(let i = u8.length - 22; i >= floor; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('不是有效的 xlsx（找不到 zip 目录）');

  const count = dv.getUint16(eocd + 10, true);
  const cdOffset = dv.getUint32(eocd + 16, true);
  const out = {};
  let p = cdOffset;
  for(let i = 0; i < count; i++){
    if(dv.getUint32(p, true) !== 0x02014b50) throw new Error('xlsx 内部结构损坏');
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOffset = dv.getUint32(p + 42, true);
    const name = new TextDecoder('utf-8').decode(u8.subarray(p + 46, p + 46 + nameLen));
    out[name] = { method:method, compSize:compSize, localOffset:localOffset };
    p += 46 + nameLen + extraLen + commentLen;
  }
  return out;
}

/* 解压单个条目。method 0 = 未压缩，8 = deflate */
async function unzipEntry(buf, entry){
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  const p = entry.localOffset;
  if(dv.getUint32(p, true) !== 0x04034b50) throw new Error('xlsx 内部结构损坏');
  const nameLen = dv.getUint16(p + 26, true);
  const extraLen = dv.getUint16(p + 28, true);
  const start = p + 30 + nameLen + extraLen;
  const comp = u8.subarray(start, start + entry.compSize);

  if(entry.method === 0) return new TextDecoder('utf-8').decode(comp);
  if(typeof DecompressionStream === 'undefined'){
    throw new Error('当前浏览器不支持解压 xlsx，请改用电脑生成 JSON 后再导入');
  }
  const stream = new Blob([comp]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  const ab = await new Response(stream).arrayBuffer();
  return new TextDecoder('utf-8').decode(new Uint8Array(ab));
}

function xmlUnescape(s){
  return String(s)
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&quot;/g,'"').replace(/&apos;/g,"'")
    .replace(/&#(\d+);/g, function(_,d){ return String.fromCharCode(+d); })
    .replace(/&amp;/g,'&');
}

function parseSharedStrings(xml){
  const out = [];
  const siRe = /<si>([\s\S]*?)<\/si>/g;
  let m;
  while((m = siRe.exec(xml))){
    let text = '';
    const tRe = /<t[^>]*>([\s\S]*?)<\/t>/g;
    let tm;
    while((tm = tRe.exec(m[1]))) text += xmlUnescape(tm[1]);
    out.push(text);
  }
  return out;
}

function cellRefToRC(ref){
  const m = /^([A-Z]+)(\d+)$/.exec(ref);
  if(!m) return null;
  let col = 0;
  for(let i = 0; i < m[1].length; i++) col = col * 26 + (m[1].charCodeAt(i) - 64);
  return { r: parseInt(m[2],10), c: col };
}

function parseSheetXml(xml, shared){
  const rows = [];
  const rowRe = /<row[^>]*r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g;
  let rm;
  while((rm = rowRe.exec(xml))){
    const rowNum = parseInt(rm[1], 10);
    const cells = [];
    const cellRe = /<c\s+([^>]*?)(\/>|>([\s\S]*?)<\/c>)/g;
    let cm;
    while((cm = cellRe.exec(rm[2]))){
      const attrs = cm[1], inner = cm[3] || '';
      const refM = /r="([A-Z]+\d+)"/.exec(attrs);
      const tM = /t="([^"]+)"/.exec(attrs);
      const type = tM ? tM[1] : 'n';
      let val = '';
      if(type === 'inlineStr'){
        const isM = /<is>([\s\S]*?)<\/is>/.exec(inner);
        if(isM){
          const tM2 = /<t[^>]*>([\s\S]*?)<\/t>/.exec(isM[1]);
          val = tM2 ? xmlUnescape(tM2[1]) : '';
        }
      }else{
        const vM = /<v[^>]*>([\s\S]*?)<\/v>/.exec(inner);
        if(vM){
          const raw = vM[1];
          val = (type === 's') ? (shared[+raw] !== undefined ? shared[+raw] : '') : xmlUnescape(raw);
        }
      }
      if(refM){
        const pos = cellRefToRC(refM[1]);
        if(pos) cells[pos.c - 1] = val;
      }
    }
    rows[rowNum - 1] = cells;
  }
  for(let i = 0; i < rows.length; i++) if(!rows[i]) rows[i] = [];
  return rows;
}

/* 找主表：优先 workbook.xml 里第一个 sheet 指向的文件，找不到就退回 sheet1.xml */
async function xlsxFirstSheet(entries, buf){
  let target = 'xl/worksheets/sheet1.xml';
  try{
    if(entries['xl/workbook.xml'] && entries['xl/_rels/workbook.xml.rels']){
      const wb = await unzipEntry(buf, entries['xl/workbook.xml']);
      const rels = await unzipEntry(buf, entries['xl/_rels/workbook.xml.rels']);
      const sheetM = /<sheet[^>]*r:id="([^"]+)"[^>]*\/?>/.exec(wb);
      if(sheetM){
        const relRe = new RegExp('<Relationship[^>]*Id="' + sheetM[1] + '"[^>]*Target="([^"]+)"');
        const relM = relRe.exec(rels);
        if(relM){
          let t = relM[1];
          target = t.charAt(0) === '/' ? t.slice(1) : ('xl/' + t.replace(/^\.\//,''));
        }
      }
    }
  }catch(e){ /* 退回默认路径 */ }
  if(!entries[target]){
    const alt = Object.keys(entries).filter(function(k){ return /^xl\/worksheets\/sheet\d+\.xml$/.test(k); })[0];
    if(alt) target = alt;
  }
  return target;
}

/* 读整个 xlsx → 二维数组（第一行通常是表头） */
async function xlsxToRows(arrayBuffer){
  const entries = zipEntries(arrayBuffer);
  const sheetPath = await xlsxFirstSheet(entries, arrayBuffer);
  if(!entries[sheetPath]) throw new Error('xlsx 里没有找到工作表');

  let shared = [];
  if(entries['xl/sharedStrings.xml']){
    shared = parseSharedStrings(await unzipEntry(arrayBuffer, entries['xl/sharedStrings.xml']));
  }
  const sheetXml = await unzipEntry(arrayBuffer, entries[sheetPath]);
  return parseSheetXml(sheetXml, shared);
}

/* ---------- 表头映射与归一化（与 tools/xlsx2json.py 同一套规则） ---------- */
function cleanHeader(s){
  return String(s == null ? '' : s)
    .replace(/[（(][^）)]*[）)]/g, '')     // 去掉（必填）这类括注
    .replace(/[\s\u3000]+/g, '');          // 去掉所有空格
}
function headerKey(s){ return cleanHeader(s).toLowerCase(); }

const XL_ALIASES = {
  n: ['序号','编号','题号','id','no','index'],
  q: ['题目','题干','试题','问题','question','stem'],
  t: ['题型','类型','题类','type'],
  a: ['正确答案','标准答案','答案','answer','key','ans'],
  m: ['解析','答疑','答案解析','解释','analysis','explain'],
  c: ['分类','章节','类别','知识点','标签','category','chapter']
};

/* 识别表头，返回 {cols:{字段:列下标}, optIdx:[列下标...]} */
function mapXlColumns(header){
  const cols = {}, used = {};
  const optIdx = [];
  header.forEach(function(raw, i){
    const cell = cleanHeader(raw);
    if(!cell) return;
    const m = /^(?:选项|option)?([A-Ha-h]|[1-8])$/i.exec(cell);
    if(m){
      let tok = m[1].toUpperCase();
      if(/^\d$/.test(tok)) tok = String.fromCharCode(64 + parseInt(tok,10));
      optIdx.push({ letter:tok, idx:i });
      used[i] = true;
    }
  });
  optIdx.sort(function(x,y){ return x.letter < y.letter ? -1 : 1; });

  Object.keys(XL_ALIASES).forEach(function(field){
    if(cols[field] !== undefined) return;
    const names = XL_ALIASES[field].map(function(x){ return x.toLowerCase(); });
    for(let i = 0; i < header.length; i++){
      if(used[i]) continue;
      const k = headerKey(header[i]);
      if(names.indexOf(k) >= 0){ cols[field] = i; used[i] = true; return; }
    }
    for(let i = 0; i < header.length; i++){
      if(used[i]) continue;
      const k = headerKey(header[i]);
      if(names.some(function(nm){ return nm.length >= 2 && k.indexOf(nm) >= 0; })){
        cols[field] = i; used[i] = true; return;
      }
    }
  });

  return { cols:cols, optIdx:optIdx.map(function(o){ return o.idx; }) };
}

function xlNormType(v){
  const k = String(v == null ? '' : v).replace(/\s/g,'');
  if(!k) return null;
  if(k === '1' || k.indexOf('单选') >= 0 || /^single/i.test(k)) return 1;
  if(k === '2' || k.indexOf('多选') >= 0 || k.indexOf('不定项') >= 0 || /^multi/i.test(k)) return 2;
  if(k === '3' || k.indexOf('判断') >= 0 || k.indexOf('是非') >= 0 || k.indexOf('对错') >= 0) return 3;
  return null;
}

/* 去掉选项自带的「A.」「B、」前缀 —— 前端会自己渲染字母 */
function xlCleanOpt(s){
  return String(s == null ? '' : s)
    .replace(/^\s*[A-Ha-h]\s*[.．、)）:：]\s*/, '')
    .trim();
}
/* 去掉题干开头的「1.」题号 */
function xlCleanStem(s){
  const t = String(s == null ? '' : s).replace(/^\s*\d{1,4}\s*[.．、)）]\s*/, '').trim();
  return t || String(s == null ? '' : s).trim();
}

/* 判断题：选项可能写成「正确/错误」「 对 / 错」「A. 正确」，统一成两选项 */
function xlIsTrueFalse(opts){
  if(opts.length !== 2) return false;
  const pair = opts.map(function(o){ return o.replace(/\s/g,''); }).join('/');
  return /^(正确|对|是|√|T|True)\/(错误|错|否|×|F|False)$/i.test(pair);
}

function xlNormAnswer(v, t, optCount){
  const s = String(v == null ? '' : v).trim();
  if(!s) return [];
  if(t === 3){
    const k = s.toLowerCase();
    if(/^(对|正确|是|√|t|true|y|yes)$/.test(k)) return ['A'];
    if(/^(错|错误|否|×|f|false|n|no)$/.test(k)) return ['B'];
  }
  const letters = s.toUpperCase().match(/[A-H]/g);
  if(letters){
    const uniq = [];
    letters.forEach(function(c){ if(uniq.indexOf(c) < 0) uniq.push(c); });
    uniq.sort();
    return uniq.filter(function(c){ return (c.charCodeAt(0) - 65) < optCount; });
  }
  return [];
}

/* 二维数组 → 题库对象（交给 validateLib 做最终校验） */
function rowsToLib(rows, fileName){
  if(!rows || !rows.length) throw new Error('表格是空的');

  // 在前 10 行里找最像表头的一行
  let headerRow = 0, best = -1;
  for(let i = 0; i < Math.min(10, rows.length); i++){
    const row = rows[i] || [];
    let score = 0;
    row.forEach(function(cell){
      const k = headerKey(cell);
      if(!k) return;
      const all = [].concat.apply([], Object.keys(XL_ALIASES).map(function(f){ return XL_ALIASES[f]; }));
      if(all.some(function(a){ return a.toLowerCase() === k; })) score += 2;
      else if(/^(?:选项|option)?([A-H]|[1-8])$/i.test(cleanHeader(cell))) score += 1;
    });
    if(score > best){ best = score; headerRow = i; }
  }
  if(best < 2) throw new Error('没认出表头，请确认表格里有「题目」「答案」这类列名');

  const map = mapXlColumns(rows[headerRow]);
  if(map.cols.q === undefined || map.cols.a === undefined){
    throw new Error('表头里缺少「题目」或「正确答案」列');
  }

  const questions = [];
  const errors = [];
  let seq = 0;

  for(let i = headerRow + 1; i < rows.length; i++){
    const row = rows[i] || [];
    const pick = function(field){ const idx = map.cols[field]; return idx === undefined ? '' : String(row[idx] == null ? '' : row[idx]); };
    const stem = xlCleanStem(pick('q'));
    if(!stem) continue;                       // 空行
    seq++;

    const t = xlNormType(pick('t'));
    let opts = map.optIdx.map(function(idx){ return xlCleanOpt(row[idx]); }).filter(function(x){ return x; });

    let type = t;
    if(type === null){                        // 没写题型：按选项数猜
      if(opts.length === 2) type = 3;
      else type = xlNormAnswer(pick('a'), null, opts.length).length > 1 ? 2 : 1;
    }
    if(type === 3 && xlIsTrueFalse(opts)) opts = ['正确','错误'];
    if(type === 3 && !opts.length) opts = ['正确','错误'];

    if(!opts.length){
      errors.push('第 ' + (i + 1) + ' 行：没有文字选项（多半是图片题）');
      continue;
    }

    let ans = xlNormAnswer(pick('a'), type, opts.length);
    if(!ans.length){
      errors.push('第 ' + (i + 1) + ' 行：答案「' + pick('a').trim() + '」无法识别或超出选项范围');
      continue;
    }
    if(type === 3 && opts.length === 2) ans = [ans[0]];

    questions.push({
      n: questions.length + 1,
      t: type,
      q: stem,
      o: opts,
      a: ans,
      m: pick('m').trim(),
      c: pick('c').trim() || '未分类'
    });
  }

  if(!questions.length){
    throw new Error('没解析出任何题目：' + (errors.slice(0, 3).join('；') || '请检查列名'));
  }

  const base = String(fileName || '导入题库').replace(/\.[^.]+$/, '');
  return { lib: { name: base, source: fileName || '', questions: questions }, errors: errors };
}

/* 载入某个库的全套数据（题库 / 练习状态 / 考试记录 / 背题进度） */
async function loadLibData(id){
  const raw=await Store.get(libKey(id));
  if(!raw){ LIB=null; storeWarn('题库数据丢失，请重新导入'); return; }
  const res=validateLib(raw);
  if(!res.ok){ LIB=null; storeWarn('题库校验未通过，请重新导入'); return; }

  LIB=res.lib;
  META.currentId=id;

  const st=await Store.get(stateKey(id));
  S=Object.assign(EMPTY_S(), st || {});
  const lg=await Store.get(logKey(id));
  LOG=Array.isArray(lg) ? lg : [];
  RIPOS=Number(await Store.get(reciteKey(id))) || 0;

  // 存档健壮性：旧版本可能缺字段或类型不对
  if(!S.answers || typeof S.answers!=='object') S.answers={};
  if(!S.notes || typeof S.notes!=='object') S.notes={};
  if(!Array.isArray(S.wrong)) S.wrong=[];
  if(!Array.isArray(S.fav)) S.fav=[];
  if(!Array.isArray(S.queue)) S.queue=[];
  if(typeof S.qidx!=='number'||!isFinite(S.qidx)) S.qidx=0;
  if(typeof S.done!=='number'||!isFinite(S.done)) S.done=0;
  if(typeof S.right!=='number'||!isFinite(S.right)) S.right=0;

  buildIdx();
  // 队列里若残留换库后的题号，直接丢
  if(S.queue.length){ S.queue=S.queue.filter(n=>byNo(n)); if(S.qidx>=S.queue.length) S.qidx=0; }

  // 考试暂存若属于别的库，作废（题库一换题号就串了）
  if(EX && EX.libId && EX.libId!==id){
    EX=null;
    Store.del('exam').catch(function(){});
  }
}

/* 导入一个新题库：作为一个独立库加进列表并切过去，不影响其它库 */
async function applyLib(o, opt){
  const res=validateLib(o);
  if(!res.ok){
    toast('导入失败，共 '+res.errs.length+' 处问题');
    return errorPage('题库没有通过校验，已取消导入', res.errs);
  }
  const id=newLibId();
  const entry={
    id:id,
    name:res.lib.name,
    count:res.lib.questions.length,
    cats:res.lib.cats.length,
    createdAt:res.lib.createdAt,
    source:res.lib.source||''
  };
  try{
    await Store.set(libKey(id), res.lib);
    await Store.set(stateKey(id), EMPTY_S());
    await Store.set(logKey(id), []);
  }catch(e){
    return errorPage('题库写入失败', [String((e && e.message) || e)]);
  }
  META.libs.push(entry);
  META.currentId=id;
  saveMeta();
  await loadLibData(id);
  toast('已导入「'+res.lib.name+'」'+res.lib.questions.length+' 题'
    + ((opt && opt.suffix) ? opt.suffix : ''));
  home();
}

async function switchLib(id){
  if(!id || id===curId()) return;
  await loadLibData(id);
  saveMeta();
  toast('已切换到「'+(LIB?LIB.name:'')+'」');

}

function renameLib(id){
  const e=META.libs.find(l=>l.id===id); if(!e) return;
  const name=prompt('题库名称', e.name);
  if(name===null) return;
  const nm=String(name).trim();
  if(!nm) return;
  e.name=nm;
  if(id===curId() && LIB) LIB.name=nm;
  saveMeta(); saveLib();
  toast('已改名');
  libMenu();
}

async function deleteLib(id){
  const e=META.libs.find(l=>l.id===id); if(!e) return;
  if(!confirm('删除「'+e.name+'」及其全部练习记录？\n此操作不可撤销。')) return;
  try{
    await Store.del(libKey(id));
    await Store.del(stateKey(id));
    await Store.del(logKey(id));
    await Store.del(reciteKey(id));
  }catch(err){
    storeWarn('删除失败：'+((err && err.message) || err));
  }
  META.libs=META.libs.filter(l=>l.id!==id);
  if(META.currentId===id) META.currentId = META.libs.length ? META.libs[0].id : '';
  saveMeta();
  if(META.currentId){
    await loadLibData(META.currentId);
  }else{
    LIB=null; IDX=new Map(); POOL={1:0,2:0,3:0}; S=EMPTY_S(); LOG=[]; RIPOS=0;
  }
  toast('已删除');
  home();
}

async function applyBackup(o){
  if(!o || typeof o!=='object'){ return toast('备份文件格式错误'); }
  const bk=o.state, lg=o.log, lb=o.lib;

  // 当前没有题库时，把备份里的题库当作新库导入；已有题库则只在当前库上恢复记录
  if(!hasLib()){
    if(!lb){ return toast('备份里没有题库'); }
    await applyLib(lb);
    if(!hasLib()) return;          // applyLib 内部已提示失败原因
  }
  if(!bk || typeof bk!=='object' || !bk.answers || typeof bk.answers!=='object'){
    return toast('备份里没有练习记录');
  }

  // 只保留能在当前题库里找到的题号
  const clean={}, drop=[];
  Object.keys(bk.answers).forEach(k=>{
    const n=Number(k);
    if(byNo(n)) clean[n]=String(bk.answers[k]); else drop.push(k);
  });

  S={
    answers:clean,
    wrong:(Array.isArray(bk.wrong)?bk.wrong:[]).map(Number).filter(n=>byNo(n)),
    fav:(Array.isArray(bk.fav)?bk.fav:[]).map(Number).filter(n=>byNo(n)),
    pos:0, queue:[], qidx:0,
    done:Number(bk.done)||0,
    right:Number(bk.right)||0
  };
  LOG=Array.isArray(lg) ? lg.filter(x=>x && Number.isFinite(Number(x.t))).slice(0,50) : [];
  save(); saveLog();
  toast('已恢复 '+Object.keys(clean).length+' 条作答'+(drop.length?'，跳过 '+drop.length+' 条失配记录':''));
  home();
}

function exportBackup(){
  if(!hasLib()){ return toast('还没有题库可导出'); }
  const data={
    app:'刷题仔', version:1, exportedAt:new Date().toISOString(),
    libId:curId(), libName:LIB.name,
    lib:LIB, state:S, log:LOG
  };
  const d=new Date(), p=n=>(n<10?'0':'')+n;
  const stamp=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());
  const safe=String(LIB.name||'题库').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,24);
  const name='刷题仔-'+safe+'-'+stamp+'.json';
  const blob=new Blob([JSON.stringify(data)], {type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  LAST_BACKUP = Date.now();
  put('lastBackup', LAST_BACKUP);
  toast('已导出 '+name);
}

function resetProgress(){

     重练/换一组时不能跟着一起清掉 */
  const keepNotes = (S && S.notes) ? S.notes : {};

  save();
  saveLog();
}

/* ---------- 答题卡（练习 / 背题共用） ---------- */
let cardMode='';
function setCardBtn(mode){
  cardMode=mode||'';
  const b=$('#qbCard');
  if(b) b.style.display = mode?'':'none';
  closeCard();
}
function closeCard(){ const el=document.getElementById('cardSheet'); if(el) el.remove(); }
/* 答题卡：1356 个题号一次全渲染会卡（实测 15ms，手机约 45ms），
   而且找第 900 题要滑 170 行。改成分页，每页 100 题。 */
const CARD_PAGE = 100;
let cardPage = 0;

/* 分页范围计算（纯函数，便于单测）：
   页数、当前页、起止下标一次算清，越界页码自动夹住 */
function cardPageRange(total, page){
  const pages = Math.max(1, Math.ceil(total / CARD_PAGE));
  const p = Math.max(0, Math.min(pages-1, Number(page)||0));
  const from = p * CARD_PAGE;
  return { pages:pages, page:p, from:from, to:Math.min(total, from + CARD_PAGE) };
}

function openCard(){
  if(document.getElementById('cardSheet')){ closeCard(); return; }
  const arr = cardMode==='recite' ? RQ : S.queue;
  if(!arr || !arr.length){ toast('还没有可跳转的题目'); return; }
  const cur = cardMode==='recite' ? RI : S.qidx;
  // 打开时自动落在当前题所在页
  cardPage = Math.max(0, Math.floor(cur / CARD_PAGE));

  const div=document.createElement('div');
  div.id='cardSheet';
  div.className='sheet';
  div.innerHTML='<div class="sheet-hd"><b>答题卡</b><span id="cardTip"></span>'
    +'<button onclick="closeCard()">关闭</button></div>'
    +'<div class="sheet-bd" id="cardSheetBd"><div class="exambar" id="cardGrid"></div></div>'
    +'<div class="card-pager" id="cardPager"></div>';
  document.body.appendChild(div);
  renderCardPage();
}

function renderCardPage(){
  const arr = cardMode==='recite' ? RQ : S.queue;
  const grid = document.getElementById('cardGrid');
  if(!grid || !arr) return;

  const total = arr.length;
  const range = cardPageRange(total, cardPage);
  cardPage = range.page;
  const from = range.from;
  const to = range.to;
  const pages = range.pages;
  const cur = cardMode==='recite' ? RI : S.qidx;

  let cells='', done=0;
  for(let i=from; i<to; i++){
    const no = arr[i];
    let cls='';
    if(cardMode!=='recite'){
      const a = S.answers[no];
      if(a){
        const q = byNo(no);
        if(q) cls = (String(a).split('').sort().join('')===toArr(q.a).sort().join('')) ? 'ok' : 'no';
      }
    }
    if(i===cur) cls=(cls+' cur').trim();
    cells += '<span class="'+cls+'" onclick="cardJump('+i+')">'+(i+1)+'</span>';
  }
  grid.innerHTML = cells;

  // 已答数量按整组统计（1356 次属性查找，实测不到 1ms）
  if(cardMode!=='recite'){
    for(let i=0; i<total; i++){ if(S.answers[arr[i]]) done++; }
  }

  const tip = document.getElementById('cardTip');
  if(tip){
    tip.textContent = cardMode==='recite'
      ? '共 '+total+' 题'
      : '已答 '+done+' / '+total+' · 绿对红错';
  }

  const pager = document.getElementById('cardPager');
  if(pager){
    pager.innerHTML = pages<=1 ? ''
      : '<button class="pbtn" onclick="cardPrevPage()" '+(cardPage===0?'disabled':'')+'>上一页</button>'
        + '<span class="pinfo">第 '+(from+1)+'-'+to+' 题<br>'+(cardPage+1)+' / '+pages+' 页</span>'
        + '<button class="pbtn" onclick="cardNextPage()" '+(cardPage>=pages-1?'disabled':'')+'>下一页</button>';
  }

  const bd = document.getElementById('cardSheetBd');
  const curEl = grid.querySelector('span.cur');
  if(curEl && bd) bd.scrollTop = Math.max(0, curEl.offsetTop - bd.clientHeight/2);
}

function cardPrevPage(){ cardPage--; renderCardPage(); }
function cardNextPage(){ cardPage++; renderCardPage(); }
function cardJump(i){
  closeCard();
  if(cardMode==='recite'){ RI=i; recite(); }
  else { S.qidx=i; save(); quiz(); }
  window.scrollTo(0,0);
}

/* ---------- 开始练习 ----------
   注意：进入新一轮必须先清掉这些题的历史作答。
   否则 quiz() 会回显旧答案、pick() 直接吞掉点击（这就是「二刷锁死」）。 */
function clearAnswersFor(ids){
  ids.forEach(n=>{ delete S.answers[n]; });
}
function startAll(){

  S.queue=ids; S.qidx=0; save(); quiz();

function startRandom(){

function startCat(cat){

/* ---------- 答题 ---------- */
let picked=[];
let autoTimer=null;
function clearAuto(){ if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; } }

function quiz(){
  VIEW='quiz';
  $('#dispBtn').style.display='none';   // 答题页头部要留给答题卡
  const no=S.queue[S.qidx];
  const q=byNo(no);
  if(!q){ toast('题目已不在题库中'); home(); return; }
  setCardBtn('practice');
  const saved=S.answers[no];
  picked = saved ? String(saved).split('') : [];

  titleEl.innerHTML='练习<span class="sub">'+esc(q.c||'')+'</span>';
  backEl.style.display=''; backEl.onclick=function(){ save(); home(); };

  const answered=!!saved;
  let optsHtml='';
  q.o.forEach((v,i)=>{
    const k=String.fromCharCode(65+i);
    let cls='opt';
    if(answered){
      if(q.a.includes(k)) cls+=' right';
      else if(picked.includes(k)) cls+=' wrong';
      else cls+=' dim';
    }else if(picked.includes(k)) cls+=' sel';
    optsHtml+='<div class="'+cls+'" data-k="'+k+'" onclick="pick(\''+k+'\')"><div class="k">'+k+'</div><div class="v">'+esc(v)+'</div></div>';
  });

  const isLast = S.qidx>=S.queue.length-1;
  let fb='';
  if(answered){
    const ok=isRight(picked,q);
    fb='<div class="fb '+(ok?'ok':'no')+'">'
      + '<div class="h">'+(ok?'✓ 答对了':'✕ 答错了')+'</div>'
      + '<div class="ans">正确答案 <b>'+ansShow(q,q.a)+'</b>　你的答案 <b>'+ansShow(q,picked)+'</b></div>'
      + (q.m?'<div class="memo"><span class="lb">解析</span>'+esc(q.m)+'</div>':'')
      + (ok && !isLast ? '<div class="autobar" id="autobar"><i></i></div>' : '')
      + (ok && isLast ? '<div class="hint">已是最后一题</div>' : '')
      + '</div>';
  }

  const noteBox = S.notes[no]
    ? '<div class="notebox" onclick="editNote()"><b>笔记</b>'+esc(S.notes[no])+'</div>'
    : '';

  body.innerHTML=
    '<div class="card">'
    + '<div class="meta"><span class="pill '+TYP_CLS[q.t]+'">'+TYP[q.t]+'</span>'
    + (q.t===2?'<span class="pidx">多选，选全才得分</span>':'')
    + '<span class="pidx">'+(S.qidx+1)+' / '+S.queue.length+'</span></div>'
    + '<div class="qbar"><i style="width:'+pct(S.qidx+1,S.queue.length)+'%"></i></div>'
    + '<div class="qtext">'+esc(q.q)+'</div>'
    + optsHtml
    + fb
    + noteBox
    + '</div>';

  ft.style.display='';
  const faved=S.fav.includes(no);
  const noteBtn='<button class="fbtn" onclick="editNote()"'
    + (S.notes[no] ? ' style="color:#2563eb"' : '') + '>✎</button>';
  let btns='';
  if(!answered){
    if(q.t===2){
      btns='<button class="fbtn" onclick="toggleFav()">'+(faved?'★':'☆')+'</button>'
          + noteBtn
          + '<button class="fbtn" id="btnAllPick" onclick="pickAll()">'+(picked.length===q.o.length?'清空':'全选')+'</button>'
          + '<button class="fbtn p" onclick="submit()">确认答案</button>';
    }else{
      btns='<button class="fbtn" onclick="toggleFav()">'+(faved?'★':'☆')+'</button>'
          + noteBtn
          + '<button class="fbtn" onclick="prev()" '+(S.qidx===0?'disabled':'')+'>上一题</button>'
          /* 未作答时的主操作是「点选项」，所以「跳过」不该抢主按钮样式 */
          + '<button class="fbtn" onclick="next()">跳过</button>';
    }
  }else{
    btns='<button class="fbtn" onclick="toggleFav()">'+(faved?'★':'☆')+'</button>'
        + noteBtn
        + '<button class="fbtn" onclick="prev()" '+(S.qidx===0?'disabled':'')+'>上一题</button>'
        + '<button class="fbtn p" onclick="next()">'+(isLast?'完成':'下一题')+'</button>';
  }
  ftin.innerHTML=btns;
}

function isRight(pick,q){
  if(pick.length!==q.a.length) return false;
  return q.a.every(k=>pick.includes(k));
}

/* 判断题显示成「正确/错误」，其余连成 ABC */
function ansShow(q, letters){
  const L=toArr(letters);
  if(q.t===3) return L.map(k=>q.o[k.charCodeAt(0)-65]||'').join(' ');
  return L.join('');
}
/* 考试专用：选项已乱序，需按 order 映射回原文 */
function examAnsShow(q, it, letters){
  const L=toArr(letters);
  if(q.t===3) return L.map(k=>q.o[it.order[k.charCodeAt(0)-65]]||'').join(' ');
  return L.join('');
}

function pickAll(){
  const no=S.queue[S.qidx];
  if(S.answers[no]) return;
  const q=byNo(no); if(!q) return;
  if(q.t!==2) return;
  const all=q.o.map((_,i)=>String.fromCharCode(65+i));
  picked = (picked.length===all.length) ? [] : all;
  quiz2Refresh();
  const b=document.getElementById('btnAllPick');
  if(b) b.textContent = (picked.length===q.o.length) ? '清空' : '全选';
}
function pick(k){
  const no=S.queue[S.qidx];
  if(S.answers[no]) return;           // 已答不再改
  const q=byNo(no); if(!q) return;
  if(q.t===2){
    const i=picked.indexOf(k);
    if(i>=0) picked.splice(i,1); else picked.push(k);
    quiz2Refresh();
  }else{
    picked=[k];
    submit();
  }
}
function quiz2Refresh(){
  document.querySelectorAll('.opt').forEach(el=>{
    el.classList.toggle('sel', picked.includes(el.dataset.k));
  });
}

function submit(){
  const no=S.queue[S.qidx], q=byNo(no);
  if(!q){ home(); return; }
  if(!picked.length){ toast('先选择答案'); return; }
  const ok=isRight(picked,q);
  S.answers[no]=picked.slice().sort().join('');
  S.done++; if(ok) S.right++;
  if(!ok){
    if(!S.wrong.includes(no)) S.wrong.push(no);
  }else{
    const i=S.wrong.indexOf(no); if(i>=0) S.wrong.splice(i,1);
  }
  save();
  quiz();                                  // 先渲染反馈（答对也要看解析）
  const isLast = S.qidx>=S.queue.length-1;
  if(ok && !isLast){
    clearAuto();
    autoTimer=setTimeout(function(){ autoTimer=null; next(); }, 900);
  }
}

function next(){
  clearAuto();
  if(S.qidx<S.queue.length-1){ S.qidx++; save(); quiz(); window.scrollTo(0,0); }
  else{ toast('本组已完成'); S.queue=[]; S.qidx=0; save(); setTimeout(function(){ home(); window.scrollTo(0,0); },700); }
}
function prev(){
  clearAuto();
  if(S.qidx>0){ S.qidx--; save(); quiz(); window.scrollTo(0,0); }
}
function toggleFav(){
  const no=S.queue[S.qidx], i=S.fav.indexOf(no);
  if(i>=0){ S.fav.splice(i,1); toast('已取消收藏'); }
  else{ S.fav.push(no); toast('已收藏'); }
  save(); quiz();
}

/* ---------- 左右滑动切题 ----------
   只有「快、短、横」的手势才触发：横向位移 >72px、纵向 <46px、600ms 内。
   这样上下滚动看长题干、或者手指轻微偏移都不会误切题。 */
let VIEW = 'home';
let swX = 0, swY = 0, swT = 0;

document.addEventListener('touchstart', function(e){
  if(!e.touches || e.touches.length !== 1) return;
  swX = e.touches[0].clientX;
  swY = e.touches[0].clientY;
  swT = Date.now();
}, { passive:true });

document.addEventListener('touchend', function(e){
  if(!swX) return;
  const x0 = swX;
  swX = 0;
  const t = e.changedTouches && e.changedTouches[0];
  if(!t) return;

  const dx = t.clientX - x0;
  const dy = t.clientY - swY;
  const dt = Date.now() - swT;
  if(Math.abs(dx) < 72 || Math.abs(dy) > 46 || dt > 600) return;

  // 弹层打开时不切题，否则会和答题卡/笔记的滚动手势打架
  if(document.getElementById('cardSheet') || document.getElementById('noteSheet')) return;

  if(VIEW === 'quiz'){
    if(dx < 0) next(); else prev();
  }else if(VIEW === 'recite'){
    if(dx < 0) reciteNext(); else recitePrev();
  }
}, { passive:true });

/* ---------- 题目笔记 ----------
   用弹层而不是 prompt：手机上 prompt 的输入框太窄，长句子几乎没法编辑。 */
function editNote(){
  const no=S.queue[S.qidx];
  if(!byNo(no)) return;
  if(document.getElementById('noteSheet')) return;

  const div=document.createElement('div');
  div.id='noteSheet';
  div.className='sheet';
  div.innerHTML='<div class="sheet-hd"><b>笔记</b>'
    + '<span>第 '+(S.qidx+1)+' 题</span>'
    + '<button onclick="closeNote()">关闭</button></div>'
    + '<div class="sheet-bd"><textarea id="noteTa" class="noteinput" '
    + 'placeholder="记下易错点、记忆方法、和自己工作场景的对照…">'+esc(S.notes[no]||'')+'</textarea></div>'
    + '<div class="card-pager">'
    +   '<button class="pbtn" onclick="closeNote()">取消</button>'
    +   '<button class="pbtn" style="background:#2563eb;color:#fff;border-color:#2563eb" onclick="saveNote()">保存</button>'
    + '</div>';
  document.body.appendChild(div);

  const ta=document.getElementById('noteTa');
  if(ta) setTimeout(function(){ ta.focus(); }, 130);
}

function saveNote(){
  const no=S.queue[S.qidx];
  const ta=document.getElementById('noteTa');
  if(!ta) return;
  const t=ta.value.trim();
  if(t) S.notes[no]=t; else delete S.notes[no];
  save();
  closeNote();
  quiz();
  toast(t ? '笔记已保存' : '笔记已清除');
}

function closeNote(){
  const el=document.getElementById('noteSheet');
  if(el) el.remove();
}

/* ---------- 列表视图 ---------- */
let listMode='wrong';
function go(mode){

  else if(mode==='stats'){ stats(); }
  else if(mode==='exlog'){ examLog(); }
}
function list(){

/* 重做：必须先清掉这些题的历史作答，否则会回显旧答案、点不动 */
function redoList(arr, at){
  if(!arr||!arr.length){ toast('没有可重做的题'); return; }
  clearAnswersFor(arr);
  S.queue=arr.slice(); S.qidx=Math.max(0,at||0); save(); quiz();
}
function startFrom(no){
  const arr=(listMode==='wrong'?S.wrong:S.fav).slice();
  redoList(arr, Math.max(0,arr.indexOf(no)));
}
function practiceList(){
  const arr=(listMode==='wrong'?S.wrong:S.fav).slice();
  redoList(arr, 0);
}
function redoLog(i){
  const r=LOG[i];
  if(!r||!r.wrong||!r.wrong.length){ toast('这次没有错题'); return; }
  redoList(r.wrong.map(w=>w.n), 0);
}

function resetAll(){
  if(!confirm('清空所有答题记录、错题、收藏和考试记录？此操作不可撤销。')) return;
  resetProgress();
